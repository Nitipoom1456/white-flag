services:
  postgres:
    image: postgres:18.6
    container_name: whiteflag_postgres
    environment:
      - POSTGRES_USER=whiteflag
      - POSTGRES_PASSWORD=whiteflag
      - POSTGRES_DB=whiteflag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
    driver: local
